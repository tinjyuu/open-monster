name: Monster idea / English
description: Join with a concept or sketch; no code required.
title: "[Monster] "
body:
  - type: input
    id: name
    attributes:
      label: Creature name
    validations:
      required: true
  - type: textarea
    id: life
    attributes:
      label: Personality, habitat and everyday life
      description: What makes this creature interesting? Attach a sketch if you have one.
    validations:
      required: true
  - type: textarea
    id: battle
    attributes:
      label: Fighting style, strengths and weaknesses
  - type: textarea
    id: help
    attributes:
      label: Where would you like help?
      description: Art, writing, moves, balancing, implementation or testing.
  - type: input
    id: credits
    attributes:
      label: Authors and collaborators
  - type: checkboxes
    id: originality
    attributes:
      label: Original work and sharing
      options:
        - label: This is original work that I intend to share under MIT when completed.
          required: true
